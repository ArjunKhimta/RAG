[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval"
version = "0.1.0"
description = "Code search retrieval pipeline: chunking, embeddings, hybrid search, reranking, answer generation"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration", "--strict-markers"]
markers = [
    "integration: reaches real MongoDB and Gemini services, or loads the downloaded reranker model; run with -m integration",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
